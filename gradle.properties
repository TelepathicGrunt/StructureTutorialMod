parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

mod_id=structure_tutorial
mod_name=Structure Tutorial Mod
mod_version=4.2.0
mod_license=MIT License
mod_group_id=com.telepathicgrunt.structure_tutorial_mod
mod_authors=TelepathicGrunt
